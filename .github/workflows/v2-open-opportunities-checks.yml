name: Froto Wave A opportunity display checks
on:
  push:
    branches: [feature/v2-open-opportunities-20261102]
permissions:
  contents: read
concurrency:
  group: froto-v2-opportunities
  cancel-in-progress: true
jobs:
  checks:
    name: Secret-free opportunity UI regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test lib/marketplace-availability.test.mjs
      - run: npx tsc --noEmit
      - run: npx eslint app/platform/page.tsx lib/marketplace-availability.ts lib/marketplace-availability.test.mjs
      # No credentials, deployments, database operations or browser UAT.
