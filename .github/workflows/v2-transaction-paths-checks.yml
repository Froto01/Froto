name: Froto Wave A transaction-side guidance checks
on:
  push:
    branches: [feature/v2-transaction-paths-20261104]
permissions:
  contents: read
concurrency:
  group: froto-v2-transaction-paths
  cancel-in-progress: true
jobs:
  checks:
    name: Secret-free transaction paths regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test lib/marketplace-directions.test.mjs
      - run: npx tsc --noEmit
      - run: npx eslint app/platform/layout.tsx lib/marketplace-directions.ts lib/marketplace-directions.test.mjs
      # No credentials, database writes, payments or deployments.
