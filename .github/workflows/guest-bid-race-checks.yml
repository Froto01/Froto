name: Guest auction bid/award race checks (no secrets)
on:
  push:
    branches: [security/guest-bid-award-lock-20261116]
  pull_request:
    branches: [spot-requirements]
permissions:
  contents: read
jobs:
  synthetic-guest-bid-race:
    if: github.ref_name == 'security/guest-bid-award-lock-20261116' || github.head_ref == 'security/guest-bid-award-lock-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx eslint 'app/api/guest-auctions/[id]/bids/route.ts' lib/security-routes.test.mjs
      - name: Inventory dependencies (read-only audit; advisory findings do not masquerade as patches)
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/froto-audit.json" || true
          node -e 'const a=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/froto-audit.json","utf8")); if(!a.metadata?.vulnerabilities) throw Error("Dependency audit unavailable"); console.log("AUDIT_COUNTS "+JSON.stringify(a.metadata.vulnerabilities)); console.log("AUDIT_ADVISORIES "+JSON.stringify(Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,via:v.via.filter(x=>typeof x==="object").map(x=>({title:x.title,url:x.url,range:x.range,severity:x.severity})),fixAvailable:v.fixAvailable}))));'
