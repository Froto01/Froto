name: Froto Wave A capacity listing review checks
on:
  push:
    branches: [feature/v2-capacity-listing-review-20261103]
permissions:
  contents: read
concurrency:
  group: froto-v2-capacity-listing
  cancel-in-progress: true
jobs:
  checks:
    name: Secret-free listing review regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test lib/capacity-listing-validation.test.mjs
      - run: npx tsc --noEmit
      - run: npx eslint app/platform/listings/new/page.tsx lib/capacity-listing-validation.ts lib/capacity-listing-validation.test.mjs
      # No auth secrets, production database, deployments or authenticated UAT.
