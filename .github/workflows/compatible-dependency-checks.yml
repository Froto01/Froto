name: Compatible dependency remediation (secret-free)
on:
  push:
    branches: [security/dependency-compatible-audit-20261124]
  pull_request:
    branches: [spot-requirements]
permissions:
  contents: read
jobs:
  dependency-check:
    if: github.ref_name == 'security/dependency-compatible-audit-20261124' || github.head_ref == 'security/dependency-compatible-audit-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact generated lock (no resolution or mutation)
        run: |
          test "$(git hash-object package-lock.json)" = "da2316fcad06c91b30b9c94a46dbd6a4ea9a487d"
          git hash-object package-lock.json | sed 's/^/CHECKED_IN_LOCK=/'
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Measure checked-in lock advisories
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json package-lock.json
          npm audit --json > "$RUNNER_TEMP/final-audit.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/runtime-audit.json" || true
          node <<'NODE'
          const fs=require('node:fs');
          for (const label of ['final','runtime']) {
            const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+label+'-audit.json'));
            if(!a.metadata?.vulnerabilities) throw Error(label+' audit unavailable');
            console.log('AUDIT_'+label.toUpperCase()+' '+JSON.stringify(a.metadata.vulnerabilities));
            for(const [name,v] of Object.entries(a.vulnerabilities||{})) console.log('ADVISORY_'+label.toUpperCase()+' '+JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{url:x.url,title:x.title,range:x.range,severity:x.severity})}));
            if(a.metadata.vulnerabilities.critical>0 || a.metadata.vulnerabilities.high>3) throw Error('High-risk audit regression');
          }
          NODE
      - name: Full lint diagnostic (separate from regression gate)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run lint
          result=$?
          echo "FULL_LINT_EXIT=$result"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-dependency-audit
          path: |
            package-lock.json
            ${{ runner.temp }}/final-audit.json
            ${{ runner.temp }}/runtime-audit.json
          retention-days: 7
